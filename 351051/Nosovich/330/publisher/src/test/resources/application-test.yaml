server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/distcomp_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: distcomp
        jdbc:
          time_zone: UTC
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    liquibase-schema: public

  kafka:
    admin:
      auto-create: false
      fail-fast: false
    listener:
      auto-startup: false

app:
  discussion:
    enabled: false
    base-url: http://localhost:24130
  kafka:
    enabled: false
  cache:
    enabled: false
