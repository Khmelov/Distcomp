server:
  port: 24110

spring:
  application:
    name: distcomp-jpa

  datasource:
    url: jdbc:postgresql://localhost:5432/distcomp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: distcomp
        jdbc:
          time_zone: UTC
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    liquibase-schema: public

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    com.distcomp: INFO
    liquibase: INFO
