server:
  port: 24110

spring:
  application:
    name: publisher

  datasource:
    url: jdbc:postgresql://localhost:5432/distcomp
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: distcomp
        jdbc:
          time_zone: UTC
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    liquibase-schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.distcomp.common.kafka,com.distcomp.common.notice,com.distcomp
        spring.json.use.type.headers: true

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  discussion:
    enabled: true
    base-url: http://localhost:24130
  kafka:
    enabled: true
    in-topic: InTopic
    out-topic: OutTopic
    publisher-group: publisher-${random.uuid}
    reply-timeout-ms: 5000
  cache:
    enabled: true
    ttl-seconds: 300

logging:
  level:
    com.distcomp: INFO
    liquibase: INFO
    org.springframework.kafka: WARN
